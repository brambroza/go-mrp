# Local development stack. Production runs on Cloud Run + Cloud SQL (see infra/).
name: mrp

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MRP_OWNER_PASSWORD: ${MRP_OWNER_PASSWORD:?set MRP_OWNER_PASSWORD in .env}
      MRP_APP_PASSWORD: ${MRP_APP_PASSWORD:?set MRP_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mrp"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      ConnectionStrings__Migrator: Host=postgres;Database=mrp;Username=mrp_owner;Password=${MRP_OWNER_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__App: Host=postgres;Database=mrp;Username=mrp_app;Password=${MRP_APP_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["app"]

volumes:
  postgres-data:
